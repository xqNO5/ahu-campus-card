name: Build APK

# Builds the debug APK and runs the JVM unit tests that pin the QR port, the captcha model's
# numeric parity and the auto-login retry policy.
# The APK is uploaded as an artifact, so no local Android SDK/Studio is needed:
# download it from the run summary and sideload it.

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android resource references
        # Catches dangling @string / R.id references in seconds instead of several minutes
        # into the resource-linking step.
        run: python3 ../tools/check_android_resources.py .

      - name: Unit tests (crypto + QR encoder + captcha model)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify the captcha model ships inside the APK
        # The .bin and the Kotlin runtime are two ends of a private contract, and "the file is
        # in the repo" does not prove "the file is in the APK". This is the cheap check that
        # the asset is really packaged (the numeric parity test lives in the unit tests).
        run: |
          set -euo pipefail
          model=app/src/main/assets/captcha_compact.bin
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"
          echo "model: $model ($(stat -c%s "$model") bytes)"
          sha256sum "$model"
          unzip -l "$apk" | grep -E 'assets/captcha_compact\.bin' \
            || { echo "::error::captcha_compact.bin is missing from the APK"; exit 1; }

      - name: Report test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ahu-campus-card-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
